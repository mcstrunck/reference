<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2724">
<title>Marion’s Reference Pop-Up</title>
<meta name="apple-mobile-web-app-title" content="Marion’s Reference Pop-Up">
<style>
  :root{
    --bg:#2b2724; --bar:#221f1c; --ink:#efe9e0; --dim:#9c948a;
    --line:#3a3531; --hit:#e8b64b;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.4 -apple-system,system-ui,sans-serif;-webkit-user-select:none}
  body{display:flex;flex-direction:column;overflow:hidden}
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
  body.fill #img{object-fit:cover}
  #fit{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.5);border-color:transparent;font-size:12px;padding:4px 10px}
  body.nobar #fit{top:calc(8px + env(safe-area-inset-top))}
  #img.on{opacity:1}
  #img{transform-origin:center center;touch-action:none;will-change:transform}
  body.nobar #bar{display:none}
  #hide{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);border-color:transparent;font-size:12px;padding:4px 10px}
  body.nobar #hide{top:calc(8px + env(safe-area-inset-top))}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;color:var(--dim);pointer-events:none}
  #credit{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:11px;color:var(--dim);
    background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #credit a{color:inherit}
  #bar{background:var(--bar);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:6px;align-items:center}
  .chips{flex-wrap:wrap}
  button{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;cursor:pointer}
  button:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
  #timers{display:flex;gap:6px;flex-wrap:wrap}
  .chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  #clock{margin-left:auto;position:relative;width:44px;height:44px;flex:none}
  #clock svg{width:100%;height:100%}
  #ring{stroke-dasharray:106.8;transition:stroke-dashoffset 1s linear}
  #digits{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){#ring{transition:none}}
  @media (prefers-reduced-motion:reduce){#img{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <img id="img" alt="">
  <div id="msg">Loading a reference…</div>
  <div id="credit"></div>
  <button id="fit" aria-label="Fit or fill the window">Fit</button>
  <button id="hide" aria-label="Show or hide controls">Hide bar</button>
</div>
<div id="bar">
  <div class="row chips" id="chips">
    <button data-s="random" aria-pressed="true">Surprise me</button>
    <button data-s="human">Human</button>
    <button data-s="animal">Animal</button>
    <button data-s="still">Still life</button>
    <button data-s="landscape">Landscape</button>
    <button data-s="film">Film</button>
    <button data-s="art">Art</button>
  </div>
  <div class="row">
    <div class="chips" id="timers" role="group" aria-label="Pose timer">
      <button data-t="0" aria-pressed="true">Timer off</button>
      <button data-t="300">5m</button>
      <button data-t="600">10m</button>
      <button data-t="900">15m</button>
      <button data-t="1200">20m</button>
      <button data-t="1800">30m</button>
      <button data-t="3600">1h</button>
    </div>
    <div id="clock" hidden>
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="var(--line)" stroke-width="3"/>
        <circle id="ring" cx="20" cy="20" r="17" fill="none" stroke="var(--hit)" stroke-width="3"
          stroke-linecap="round" transform="rotate(-90 20 20)"/>
      </svg>
      <span id="digits"></span>
    </div>
  </div>
</div>

<script>
// Each subject maps to a few Wikimedia Commons search phrases.
// One is picked at random, then a random page of results, then a random file.
const SUBJECTS = {
  human: ['portrait photograph face', 'person standing full body photograph', 'hands photograph close-up', 'figure drawing model pose'],
  animal: ['cat photograph', 'dog portrait photograph', 'horse photograph', 'bird perched photograph', 'wild animal photograph'],
  still: ['still life photograph fruit', 'still life painting', 'vase flowers table photograph', 'kitchen objects still life'],
  film: ['film screenshot', 'film still scene', 'silent film frame', 'movie screenshot black and white', 'film noir still'],
  art: ['oil painting portrait 17th century', 'impressionist painting museum', 'renaissance painting', 'dutch golden age painting',
        'baroque painting', 'post-impressionist painting', 'romanticism painting landscape', 'japanese woodblock print ukiyo-e'],
  landscape: ['mountain landscape photograph', 'coastal landscape photograph', 'forest path photograph', 'rural landscape painting'],
};
const pick = a => a[Math.floor(Math.random() * a.length)];

let subject = 'random', timerId = null, seconds = 0;
const img = document.getElementById('img'), msg = document.getElementById('msg'),
      credit = document.getElementById('credit'), clock = document.getElementById('clock'),
      timers = document.getElementById('timers');
let timerLen = 0;

async function fetchRef() {
  const s = subject === 'random' ? pick(Object.keys(SUBJECTS)) : subject;
  const q = pick(SUBJECTS[s]) + ' filetype:bitmap -incategory:"AI-generated images"';
  const offset = Math.floor(Math.random() * 150);   // reach past the first page so it feels random
  const url = 'https://commons.wikimedia.org/w/api.php?origin=*&format=json&action=query'
    + '&generator=search&gsrnamespace=6&gsrlimit=20&gsroffset=' + offset
    + '&gsrsearch=' + encodeURIComponent(q)
    + '&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1400';
  const r = await fetch(url);
  const data = await r.json();
  const pages = Object.values(data.query?.pages || {}).filter(p => p.imageinfo);
  if (!pages.length) throw new Error('empty');
  const p = pick(pages), info = p.imageinfo[0], meta = info.extmetadata || {};
  const artist = (meta.Artist?.value || '').replace(/<[^>]+>/g, '').trim();
  const lic = meta.LicenseShortName?.value || '';
  return { src: info.thumburl || info.url, page: info.descriptionurl, artist, lic,
           title: p.title.replace(/^File:/, '') };
}

async function next() {
  img.classList.remove('on'); msg.textContent = 'Loading a reference…'; credit.textContent = '';
  for (let tries = 0; tries < 3; tries++) {
    try {
      const ref = await fetchRef();
      await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = ref.src; });
      img.alt = ref.title; img.classList.add('on'); msg.textContent = '';
      credit.innerHTML = `<a href="${ref.page}" target="_blank" rel="noopener">${ref.artist || 'Wikimedia Commons'}${ref.lic ? ' · ' + ref.lic : ''}</a>`;
      restartTimer(); return;
    } catch (e) { /* try another */ }
  }
  msg.textContent = 'Couldn’t load an image. Check the connection and tap Next.';
}

const ring = document.getElementById('ring'), digits = document.getElementById('digits'), C = 106.8;
function restartTimer() {
  clearInterval(timerId); seconds = timerLen; clock.hidden = !seconds;
  if (!seconds) return;
  ring.style.transition = 'none'; ring.style.strokeDashoffset = 0;   // full ring, no animate-in
  requestAnimationFrame(() => ring.style.transition = '');
  const tick = () => {
    digits.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    ring.style.strokeDashoffset = C * (1 - seconds / timerLen);   // ring drains clockwise
    if (seconds-- <= 0) next();
  };
  tick(); timerId = setInterval(tick, 1000);
}

document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  subject = b.dataset.s;
  for (const c of e.currentTarget.children) c.setAttribute('aria-pressed', c === b);
  next();
});
timers.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  timerLen = +b.dataset.t;
  for (const c of timers.children) c.setAttribute('aria-pressed', c === b);
  restartTimer();
});
// --- resize the picture inside the window: pinch to zoom, drag to pan, double-tap resets
let scale = 1, tx = 0, ty = 0, pts = new Map(), startDist = 0, startScale = 1, last = null, moved = false, lastTap = 0;
const apply = () => img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
img.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, e); img.setPointerCapture(e.pointerId); moved = false;
  if (pts.size === 2) { const [a, b] = [...pts.values()]; startDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); startScale = scale; }
  else last = { x: e.clientX, y: e.clientY };
});
img.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    scale = Math.min(6, Math.max(1, startScale * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / startDist));
    moved = true; apply();
  } else if (last && scale > 1) {
    tx += e.clientX - last.x; ty += e.clientY - last.y; last = { x: e.clientX, y: e.clientY }; moved = true; apply();
  }
});
const up = e => {
  pts.delete(e.pointerId); last = null;
  if (pts.size) return;
  if (moved) return;
  const now = Date.now();
  if (now - lastTap < 300) { scale = 1; tx = ty = 0; apply(); lastTap = 0; }   // double-tap: reset
  else { lastTap = now; setTimeout(() => { if (lastTap === now) next(); }, 300); }  // single tap: next
};
img.addEventListener('pointerup', up); img.addEventListener('pointercancel', up);
img.addEventListener('load', () => { scale = 1; tx = ty = 0; apply(); });

document.getElementById('fit').onclick = e => {
  const fill = document.body.classList.toggle('fill');
  e.target.textContent = fill ? 'Fill' : 'Fit';
  scale = 1; tx = ty = 0; apply();
};
document.getElementById('hide').onclick = e => {
  const off = document.body.classList.toggle('nobar');
  e.target.textContent = off ? 'Show bar' : 'Hide bar';
};
next();
</script>
</body>
</html>
